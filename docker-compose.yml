version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ausbildung_postgres
    restart: always
    environment:
      POSTGRES_DB: ausbildung_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema:/docker-entrypoint-initdb.d

volumes:
  pgdata: